<!-- @lahsrocketry mark: triangle nose, body, two fins, flame in the pillar accent.
     Inlined into every card, so currentColor is the card's ink and var(--accent)
     is the pillar's accent. The fallbacks keep it readable opened on its own. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="logo" role="img" aria-label="LAHS Rocketry">
  <path d="M21.5 32.5 L6 53 L21.5 47.5 Z" fill="currentColor" opacity="0.7" />
  <path d="M42.5 32.5 L58 53 L42.5 47.5 Z" fill="currentColor" opacity="0.7" />
  <path d="M32 1.5 L43.5 25.5 L20.5 25.5 Z" fill="currentColor" />
  <rect x="20.5" y="24" width="23" height="25" rx="4.5" fill="currentColor" />
  <circle cx="32" cy="33.5" r="5.5" fill="#0e1a2b" />
  <path d="M25.5 50 C 27 55.5, 30 57.5, 32 62.5 C 34 57.5, 37 55.5, 38.5 50 Z" fill="var(--accent, #ff7a1a)" />
</svg>
